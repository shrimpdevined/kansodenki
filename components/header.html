<!-- Dynamic Fading Background Bars (One per page color) -->
<div class="header-bars">
    <div class="header-bar active" id="home-bar" style="--bar-rgb: 0, 255, 255;"></div>
    <div class="header-bar" id="products-bar" style="--bar-rgb: 255, 0, 85;"></div>
    <div class="header-bar" id="about-bar" style="--bar-rgb: 255, 255, 0;"></div>
    <div class="header-bar" id="contact-bar" style="--bar-rgb: 255, 85, 0;"></div>
</div>

<!-- Dynamic Title Container -->
<div class="title-wrapper">
    <div class="main-title-group" style="--shadow-1: #ff0055; --shadow-2: #00ffff;">
        <h1 class="ja-title">簡素電気</h1>
        <h2 class="en-title">SIMPLE ELECTRIC</h2>
    </div>

    <!-- HOME SLIDING TITLE (Cyan/Pink) -->
    <div class="page-title active" id="home-title" style="--shadow-1: #ff0055; --shadow-2: #00ffff;">
        <h1 class="ja-title">端末</h1>
        <h2 class="en-title">TERMINAL</h2>
    </div>

    <!-- PRODUCTS SLIDING TITLE (Cyan/Pink) -->
    <div class="page-title" id="products-title" style="--shadow-1: #00ffff; --shadow-2: #ff0055;">
        <h1 class="ja-title">製品</h1>
        <h2 class="en-title">PRODUCTS</h2>
    </div>
    
    <!-- ABOUT SLIDING TITLE (Yellow/Pink) -->
    <div class="page-title" id="about-title" style="--shadow-1: #ffff00; --shadow-2: #ff0055;">
        <h1 class="ja-title">概要</h1>
        <h2 class="en-title">ABOUT</h2>
    </div>

    <!-- CONTACT SLIDING TITLE (Orange/Yellow) -->
    <div class="page-title" id="contact-title" style="--shadow-1: #ff5500; --shadow-2: #ffff00;">
        <h1 class="ja-title">通信</h1>
        <h2 class="en-title">CONTACT</h2>
    </div>
</div>
